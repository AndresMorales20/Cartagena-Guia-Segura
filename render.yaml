services:
  - type: web
    name: cartagena-guia-segura
    runtime: php
    branch: main
    buildCommand: |
      composer install --optimize-autoloader --no-dev
      npm install
      npm run prod
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://cartagena-guia-segura.onrender.com
      - key: APP_KEY
        value: "HsCh47ZWjU6+6Cw/WzMYom3j9VMDKe455ZXNLSFLglQ="
