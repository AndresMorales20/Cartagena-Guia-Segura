services:
  - name: cartagena-guia-segura
    type: web
    env: php
    branch: main
    buildCommand: |
      # Instala dependencias
      composer install --optimize-autoloader --no-dev
      npm install
      npm run prod
      # Limpieza de caches de Laravel
      php artisan config:clear
      php artisan cache:clear
      php artisan route:clear
      php artisan view:clear
    startCommand: sh -c 'php -S 0.0.0.0:$PORT -t public'
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://cartagena-guia-segura.onrailway.app
      - key: APP_KEY
        value: HsCh47ZWjU6+6Cw/WzMYom3j9VMDKe455ZXNLSFLglQ=
